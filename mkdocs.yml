site_name: GreenDevOps Framework
site_description: Official documentation for the GreenDevOps plugin and AI build optimizer.
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quick Start Guides:
      - Docker Deployment: quick_start_docker.md
      - Local Deployment: quick_start_local.md
  - Concepts:
      - System Architecture: concepts/architecture.md
      - Carbon-Aware Scheduling: concepts/carbon_aware_scheduling.md
  - Configuration:
      - Overview: configuration/overview.md
      - Full Reference: configuration/reference.md
      - Examples: configuration/examples.md
  - CLI Reference: cli/reference.md
  - Pipeline:
      - Full Jenkinsfile Walkthrough: pipeline/full_jenkinsfile.md
      - Output Schema: pipeline/output_schema.md
  - Deploy Component:
      - Overview: deploy/overview.md
      - Green Score: deploy/green_score.md
      - API Reference: deploy/api_reference.md
      - Setup & Installation: deploy/setup.md
  - How It Works: how_it_works.md
  - Troubleshooting: troubleshooting.md
